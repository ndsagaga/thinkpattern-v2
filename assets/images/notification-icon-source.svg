<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Android notification SMALL icon (status bar). Android ignores color and
       uses ONLY the alpha channel, painting the silhouette flat white and
       tinting it with default_notification_color. So everything here is opaque
       white on transparent; only the SHAPE matters.

       Two deliberate departures from the launcher mark:
       - Strokes are thickened (0.30 vs 0.191) because the source knot is fine
         line-art that would vanish at ~24dp once flattened to a silhouette.
       - No safe-zone shrink: notification icons aren't corner-masked, so the
         mark fills more of the frame (scale 0.85).
       Geometry from design/ThinkPattern/assets/brand/thinkpattern-mark.svg. -->
  <g transform="translate(50 50) scale(0.85) translate(-50 -50)">
    <g transform="translate(50 50) rotate(45) scale(12.564) translate(-2.5 -2.5)">
      <g fill="none" stroke="#ffffff" stroke-width="0.30" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 0.54 L1 4.46"/>
        <path d="M2 0.54 L2 4.46"/>
        <path d="M3 0.54 L3 4.46"/>
        <path d="M4 0.54 L4 4.46"/>
        <path d="M0.54 1 L4.46 1"/>
        <path d="M0.54 2 L4.46 2"/>
        <path d="M0.54 3 L4.46 3"/>
        <path d="M0.54 4 L4.46 4"/>
        <path d="M1 0.54 A 0.46 0.46 0 1 0 0.54 1"/>
        <path d="M4 0.54 A 0.46 0.46 0 1 1 4.46 1"/>
        <path d="M1 4.46 A 0.46 0.46 0 1 1 0.54 4"/>
        <path d="M4 4.46 A 0.46 0.46 0 1 0 4.46 4"/>
        <path d="M2 0.54 A 0.5 0.5 0 0 1 3 0.54"/>
        <path d="M2 4.46 A 0.5 0.5 0 0 0 3 4.46"/>
        <path d="M0.54 2 A 0.5 0.5 0 0 0 0.54 3"/>
        <path d="M4.46 2 A 0.5 0.5 0 0 1 4.46 3"/>
      </g>
      <g fill="#ffffff" stroke="none">
        <circle cx="2.5" cy="2.5" r="0.20"/>
      </g>
    </g>
  </g>
</svg>
